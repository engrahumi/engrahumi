plugins {
    id 'com.android.application'
}

android {
    namespace 'com.engrahumi.littlehero'
    compileSdk 35

    defaultConfig {
        applicationId 'com.engrahumi.littlehero'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly on a phone.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
